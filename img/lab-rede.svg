<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="340" fill="#f8f9fa"/>
  <text x="300" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#212529">Laboratório de rede virtual (VirtualBox)</text>
  <!-- Internet -->
  <ellipse cx="300" cy="78" rx="70" ry="24" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="300" y="84" text-anchor="middle" font-size="15" fill="#0d6efd">Internet (NAT)</text>
  <line x1="300" y1="102" x2="300" y2="128" stroke="#495057" stroke-width="2"/>
  <!-- pfSense -->
  <rect x="215" y="128" width="170" height="46" rx="8" fill="#dc3545"/>
  <text x="300" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">pfSense</text>
  <text x="300" y="167" text-anchor="middle" font-size="12" fill="#fff">firewall / router</text>
  <line x1="300" y1="174" x2="300" y2="200" stroke="#495057" stroke-width="2"/>
  <!-- Rede interna -->
  <rect x="120" y="200" width="360" height="30" rx="6" fill="#6c757d"/>
  <text x="300" y="220" text-anchor="middle" font-size="13" fill="#fff">Rede interna</text>
  <line x1="200" y1="230" x2="200" y2="256" stroke="#495057" stroke-width="2"/>
  <line x1="400" y1="230" x2="400" y2="256" stroke="#495057" stroke-width="2"/>
  <!-- Servidor -->
  <rect x="95" y="256" width="210" height="62" rx="8" fill="#0d6efd"/>
  <text x="200" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Windows Server</text>
  <text x="200" y="300" text-anchor="middle" font-size="12" fill="#fff">AD · DNS · DHCP · IIS</text>
  <!-- Cliente -->
  <rect x="325" y="256" width="150" height="62" rx="8" fill="#198754"/>
  <text x="400" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Cliente</text>
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#fff">Windows no domínio</text>
</svg>
